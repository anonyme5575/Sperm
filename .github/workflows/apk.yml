name: APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: duo-apk
          path: dist/duo.apk
