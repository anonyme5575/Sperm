name: Mes Fanfics

on:
  push:
    paths:
      - "fanfics/**"
      - "android/fetch-tools.sh"
      - ".github/workflows/fanfics.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node fanfics/tests/test.cjs

  apk:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: fanfics/android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mes-fanfics-apk
          path: dist/mes-fanfics.apk
