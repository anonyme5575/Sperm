name: Moniteur PC

on:
  push:
    paths:
      - "moniteur/**"
      - "android/fetch-tools.sh"
      - ".github/workflows/moniteur.yml"
  workflow_dispatch:

permissions:
  contents: write # pour publier MoniteurPC.exe et moniteur-pc.apk dans la release « moniteur-pc »

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test moniteur/tests/MoniteurPC.Tests.csproj --logger "console;verbosity=normal"

  exe:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # PresentMon (Intel, licence MIT) mesure les FPS ; PawnIO est le pilote des capteurs, le même
      # installateur que celui fourni avec LibreHardwareMonitor 0.9.6. Les deux sont inclus dans l'exe.
      - name: Outils inclus dans l'exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force moniteur/pc/outils | Out-Null
          $r = Invoke-RestMethod https://api.github.com/repos/GameTechDev/PresentMon/releases/latest -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          $a = $r.assets | Where-Object { $_.name -match '^PresentMon-[\d.]+-x64\.exe$' } | Select-Object -First 1
          if (-not $a) { throw "PresentMon introuvable dans $($r.tag_name)" }
          Invoke-WebRequest $a.browser_download_url -OutFile moniteur/pc/outils/PresentMon.exe
          Invoke-WebRequest https://raw.githubusercontent.com/LibreHardwareMonitor/LibreHardwareMonitor/v0.9.6/LibreHardwareMonitor/Resources/PawnIO_setup.exe -OutFile moniteur/pc/outils/PawnIO_setup.exe
          Get-ChildItem moniteur/pc/outils | Format-Table Name, Length
      - run: dotnet publish moniteur/pc/MoniteurPC.csproj -c Release -o publish
      - name: Vérifier que l'exe démarre, mesure et sert la page
        shell: pwsh
        run: |
          $p = Start-Process publish/MoniteurPC.exe -ArgumentList "--test" -PassThru
          $etat = $null
          foreach ($i in 1..30) {
            Start-Sleep 2
            try { $etat = Invoke-RestMethod http://localhost:8790/api/etat; if ($etat.t) { break } } catch { }
          }
          $page = Invoke-WebRequest http://localhost:8790/ -UseBasicParsing
          Stop-Process $p.Id -Force
          if ($page.Content -notmatch "Moniteur PC") { throw "page introuvable" }
          if (-not $etat) { throw "pas d'état" }
          "Composants : " + (($etat.composants | ForEach-Object { "$($_.type)=$($_.nom)" }) -join ", ")
          "CPU $($etat.cpu) %, RAM $($etat.ram) %, disques $($etat.disques.Count), FPS : $($etat.fps_statut)"
          if ($etat.composants.Count -eq 0) { throw "aucun capteur lu" }
      - uses: actions/upload-artifact@v4
        with:
          name: MoniteurPC-exe
          path: publish/MoniteurPC.exe

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: moniteur/android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MoniteurPC-apk
          path: dist/moniteur-pc.apk

  publier:
    needs: [exe, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: moniteur-pc
          name: Moniteur PC
          body: |
            - **MoniteurPC.exe** : à lancer sur le PC Windows (il demande les droits administrateur).
            - **moniteur-pc.apk** : l'app Android du téléphone.
            Mode d'emploi : moniteur/README.md
          files: |
            art/MoniteurPC.exe
            art/moniteur-pc.apk
          make_latest: false
